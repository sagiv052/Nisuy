databases:
  - name: telegram-catalog-db
    databaseName: telegram_catalog
    user: telegram_bot
    plan: free
    region: singapore

services:
  - type: web
    name: telegram-stream-server
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /ping
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-catalog-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: telegram-stream-bot
      - key: CATALOG_SYNC_INTERVAL
        value: "60"
      # BASE_URL לא חובה — הקוד מגלה אותו אוטומטית מ-RENDER_EXTERNAL_URL.
